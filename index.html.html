iksplɔ́ːr",""],["Vocabulario básico","enemy","enemigo","Helen and I used to be friends, but she is my enemy now.","énəmi",""],["Vocabulario básico","invite","invitar","Mrs. Jones invited us into her home.","inváit",""],["Vocabulario básico","repeat","repetir","Can you please repeat the question?","ripíːt",""],["Vocabulario básico","married","casado","They got married last Saturday. It was a beautiful event.","mǽrid",""],["Vocabulario básico","weather","Tiempo; aguantar","We did not have our baseball game because of bad weather.","wéðər",""],["Vocabulario básico","pocket","bolsillo","He puts the number in his pocket.","pɑ́kit",""],["Vocabulario básico","thin","Delgado, fino","The laptop is thin.","θín",""],["Vocabulario básico","temperature","temperatura","When Cassie is sick, her temperature rises.","témpərətʃər",""],["Vocabulario básico","surprise","sorprender","The party was a surprise. She had no idea about it.","sərpráiz",""],["Vocabulario básico","connect","conectar","Marvin connects a big screen to his dad's computer.","kənékt",""],["Vocabulario básico","advice","consejo","He gives them advice about saving money.","ædváis",""],["Vocabulario básico","empty","vacío","The pool is empty. It does not have water.","émpti",""],["Vocabulario básico","storm","tormenta","The two men hurried to go inside during the storm.","stɔ́ːrm",""],["Vocabulario básico","desk","escritorio","There are many desks in the room.","désk",""],["Vocabulario básico","fruit","Fruta","She eats fruit every day.","frúːt",""],["Vocabulario básico","expensive","Caro, costoso","The car is expensive.","ikspénsiv",""],["Vocabulario básico","dance","bailar","They were wearing nice clothes and dancing.","dǽns",""],["Vocabulario básico","ring","anillo","This ring is not cheap.","ríŋ",""],["Vocabulario básico","mark","marca","He made a mark in the box next to his answer.","mɑ́ːrk",""],["Vocabulario básico","comfortable","cómodo","She is comfortable on her new sofa.","kʌ́mftəbl",""],["Vocabulario básico","angry","Enfadado, rabioso","Because Jane does not listen to her, Jane's mom is angry.","ǽŋɡri","😠"],["Vocabulario básico","accident","accidente","Dennis had an accident riding his bicycle. He hurt his leg.","ǽksədənt",""],["Vocabulario básico","meal","comida","She made a terrible meal. No one liked it.","míːl",""]]}</script>
<script>
const KEY='ingles-a1-v1';
const td=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const yd=()=>{const d=new Date();d.setDate(d.getDate()-1);return td(d)};
const eod=()=>{const d=new Date();d.setHours(23,59,59,999);return d.getTime()};
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const mk=(deck,front,back,ex)=>({id:uid(),deck,front,back,ex,new:true,ef:2.5,iv:0,reps:0,due:0});
function seed(){return{decks:[],set:{nl:12,rl:100,typ:false,auto:true},log:{date:td(),newDone:0,revDone:0},streak:0,last:'',cards:[]}}
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.cards)S=seed();
const D=JSON.parse(document.getElementById('d').textContent);
function ensureBig(){const have=new Set(S.cards.map(c=>c.deck+'|'+c.front));
D.decks.forEach(n=>{if(!S.decks.includes(n))S.decks.push(n)});
const add=D.cards.filter(p=>!have.has(p[0]+'|'+p[1])).map(p=>Object.assign(mk(p[0],p[1],p[2],p[3]||''),{i:p[4]||'',e:p[5]||'',s:1}));
if(add.length)S.cards.push(...add)}
ensureBig();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
if(S.log.date!==td()){S.log={date:td(),newDone:0,revDone:0}}
save();
let view='home',study=null,edit=null,q='',deckF='',armed=false;
const $=s=>document.querySelector(s),byId=id=>S.cards.find(c=>c.id===id);
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function counts(deck){const e=eod();let n=0,r=0;S.cards.forEach(c=>{if(deck&&c.deck!==deck)return;if(c.new)n++;else if(c.due<=e)r++});
return{n:Math.min(n,Math.max(0,S.set.nl-S.log.newDone)),r:Math.min(r,Math.max(0,S.set.rl-S.log.revDone))}}
function sched(c,g){let ef=c.ef,iv=c.iv,r=c.reps;
if(g==0){r=0;iv=0;ef=Math.max(1.3,ef-.2)}
else if(g==1){iv=r==0?1:Math.max(iv+1,Math.round(iv*1.2));ef=Math.max(1.3,ef-.15);r++}
else if(g==2){iv=r==0?1:r==1?3:Math.round(iv*ef);r++}
else{iv=r==0?3:Math.max(iv+2,Math.round(iv*ef*1.3));ef+=.15;r++}
return{ef,iv,reps:r}}
const lab=iv=>iv==0?'10 min':iv<30?iv+' d':Math.round(iv/30)+' mes';
function startStudy(deck){const e=eod();
const rev=S.cards.filter(c=>(!deck||c.deck===deck)&&!c.new&&c.due<=e).sort((a,b)=>a.due-b.due).slice(0,counts(deck).r);
const nw=S.cards.filter(c=>(!deck||c.deck===deck)&&c.new).sort((a,b)=>(a.p??2)-(b.p??2)).slice(0,counts(deck).n);
const ids=[...rev,...nw].map(c=>c.id);
if(!ids.length){toast('Nada pendiente por ahora');return}
study={q:ids,show:false,seen:{},done:0};render()}
const exitStudy=()=>{study=null;render()};
const reveal=()=>{study.show=true;render()};
function say(){const c=byId(study.q[0]);if(!c||!window.speechSynthesis)return toast('Tu navegador no tiene voz');
speechSynthesis.cancel();[c.front,study.show?c.ex:''].filter(Boolean).forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u)})}
function grade(g){const c=byId(study.q[0]);const r=sched(c,g);const wasNew=c.new;
Object.assign(c,{ef:r.ef,iv:r.iv,reps:r.reps,new:false});
if(g==0)c.due=Date.now()+600000;else{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+r.iv);c.due=d.getTime()}
if(wasNew)S.log.newDone++;else if(!study.seen[c.id])S.log.revDone++;
study.seen[c.id]=1;
const t=td();if(S.last!==t){S.streak=S.last===yd()?S.streak+1:1;S.last=t}
study.q.shift();if(g==0)study.q.push(c.id);else study.done++;
study.show=false;study.ty='';study.k='';save();render()}
const tog=()=>{S.set.typ=!S.set.typ;save();render()},togA=()=>{S.set.auto=!S.set.auto;save();render()};
function autoSay(){if(!S.set.auto||!window.speechSynthesis)return;const c=byId(study.q[0]);if(!c)return;const k=c.id+study.show;if(study.k===k)return;study.k=k;
const t=study.show?c.ex:(S.set.typ?'':c.front);if(!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function chk(){const t=$('#ty');study.ty=t?t.value:'';study.show=true;render()}
function studyHTML(){const c=byId(study.q[0]);
if(!c)return`<main class="done"><h1>Sesión terminada</h1><p>Repasaste ${study.done} tarjetas.</p><br><button class="big" onclick="exitStudy()">Volver al inicio</button></main>`;
const T=S.set.typ,ok=(study.ty||'').trim().toLowerCase()===c.front.toLowerCase();
const gr=[['Otra vez',0],['Difícil',1],['Bien',2],['Fácil',3]].map(([n,g])=>`<button class="g g${g}" onclick="grade(${g})">${n}<small>${lab(sched(c,g).iv)}</small></button>`).join('');
const emo=c.e?`<div class="emo">${c.e}</div>`:'';
const head=T&&!study.show?`${emo}<div class="back">${esc(c.back)}</div><input id="ty" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Escríbela en inglés" onkeydown="if(event.key==='Enter')chk()">`
:`<div class="front">${esc(c.front)}</div><button class="ghost" onclick="say()">Escuchar</button>`;
const res=T&&study.show?`<div class="${ok?'ok':'no'}">${ok?'Bien escrita':'Escribiste: '+esc(study.ty||'(nada)')}</div>`:'';
const tail=study.show?`<hr>${emo}<div class="back">${esc(c.back)}</div>${c.i?`<div class="ex">${esc(c.i)}</div>`:''}${c.ex?`<div class="ex">${esc(c.ex)}</div>`:''}`:'';
return`<div class="bar"><button class="ghost" onclick="exitStudy()">Salir</button><button class="ghost" onclick="togA()">Voz: ${S.set.auto?'sí':'no'}</button><button class="ghost" onclick="tog()">Escribir: ${T?'sí':'no'}</button></div>
<main class="study"><div class="card"><div class="deckname">${esc(c.deck)} · ${study.q.length} por ver</div>${head}${res}${tail}</div></main>
<div class="dock">${study.show?gr:T?'<button class="big" onclick="chk()">Comprobar</button>':'<button class="big" onclick="reveal()">Mostrar respuesta</button>'}</div>`}
function homeHTML(){const t=counts('');
const rows=S.decks.map(d=>{const k=counts(d),tot=S.cards.filter(c=>c.deck===d).length;
return`<button class="row" onclick="startStudy(this.dataset.d)" data-d="${esc(d)}"><span><b>${esc(d)}</b><small>${tot} tarjetas</small></span><span class="pill">${k.n} nuevas, ${k.r} repasos</span></button>`}).join('');
return`<h1>Hola</h1><p>Hoy te tocan ${t.n} nuevas y ${t.r} repasos.</p>
<button class="row" onclick="startStudy('')"><span><b>Estudiar todo</b><small>Todos los mazos</small></span><span class="pill">${t.n+t.r}</span></button>
<h2>Mazos</h2>${rows||'<p>Aún no tienes mazos. Crea una tarjeta y se creará el mazo.</p>'}`}
function listHTML(){const s=q.toLowerCase();
const l=S.cards.filter(c=>(!deckF||c.deck===deckF)&&(!s||(c.front+' '+c.back).toLowerCase().includes(s)));
return l.slice(0,100).map(c=>`<button class="row" onclick="openEdit('${c.id}')"><span><b>${esc(c.front)}</b><small>${esc(c.back)}</small></span><small>${esc(c.deck)}</small></button>`).join('')+(l.length>100?`<p>Mostrando 100 de ${l.length}. Usa el buscador o elige un mazo.</p>`:'')||'<p>No hay tarjetas. Pulsa "Nueva tarjeta" para crear la primera.</p>'}
function cardsHTML(){return`<h1>Tarjetas</h1><input id="q" placeholder="Buscar" value="${esc(q)}" oninput="q=this.value;$('#list').innerHTML=listHTML()">
<select onchange="deckF=this.value;$('#list').innerHTML=listHTML()"><option value="">Todos los mazos</option>${S.decks.map(d=>`<option ${d===deckF?'selected':''}>${esc(d)}</option>`).join('')}</select>
<div id="list">${listHTML()}</div><button class="fab" onclick="openEdit()">Nueva tarjeta</button>`}
function moreHTML(){const st=S.last===td()||S.last===yd()?S.streak:0;
const mad=S.cards.filter(c=>c.iv>=21).length;
return`<h1>Progreso</h1><div class="tiles">
<div class="tile"><b>${st}</b><span>días seguidos</span></div><div class="tile"><b>${S.log.newDone+S.log.revDone}</b><span>tarjetas hoy</span></div>
<div class="tile"><b>${S.cards.length}</b><span>tarjetas en total</span></div><div class="tile"><b>${mad}</b><span>bien aprendidas</span></div></div>
<h2>Límites diarios</h2><label>Tarjetas nuevas por día</label><input type="number" min="0" value="${S.set.nl}" onchange="S.set.nl=Math.max(0,+this.value||0);save()">
<label>Repasos máximos por día</label><input type="number" min="0" value="${S.set.rl}" onchange="S.set.rl=Math.max(0,+this.value||0);save()">
<h2>Copia de seguridad</h2><p>Tus tarjetas se guardan solo en este navegador. La copia no incluye las tarjetas del curso que aún no has estudiado (se vuelven a cargar solas). Copia este texto y guárdalo en tus notas de vez en cuando.</p>
<textarea id="bk" rows="4" readonly>${esc(JSON.stringify({...S,cards:S.cards.filter(c=>!(c.s&&c.new))}))}</textarea><button class="big" onclick="copyBk()">Copiar copia de seguridad</button>
<h2>Importar</h2><p>Pega una copia de seguridad, o una lista con una tarjeta por línea: inglés ; español ; ejemplo</p>
<textarea id="imp" rows="4" placeholder="give up ; rendirse ; Don't give up."></textarea>
<button class="big" id="impb" onclick="doImport()">Importar</button>`}
function copyBk(){const t=$('#bk');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast('Copiado'),()=>{});else toast(ok?'Copiado':'Mantén pulsado el texto para copiarlo')}
function doImport(){const v=$('#imp').value.trim();if(!v)return toast('Pega algo primero');
try{const j=JSON.parse(v);if(j&&j.cards){if(!armed){armed=true;$('#impb').textContent='Toca otra vez para reemplazar todo';return}
S=j;ensureBig();armed=false;save();$('#imp').value='';toast('Copia restaurada');render();return}}catch(e){}
let n=0;v.split('\n').forEach(l=>{const p=l.split(/;|\t/).map(x=>x.trim());if(p[0]&&p[1]){S.cards.push(mk('Importadas',p[0],p[1],p[2]||''));n++}});
if(!n)return toast('No encontré tarjetas en ese texto');
if(!S.decks.includes('Importadas'))S.decks.push('Importadas');save();$('#imp').value='';toast(n+' tarjetas añadidas');render()}
function openEdit(id){edit=id?{...byId(id)}:{deck:deckF||S.decks[0]||'General',front:'',back:'',ex:''};render()}
function editorHTML(){return`<div class="sheet"><div><h2 style="margin-top:0">${edit.id?'Editar tarjeta':'Nueva tarjeta'}</h2>
<label>Mazo</label><input id="ed" list="dl" value="${esc(edit.deck)}"><datalist id="dl">${S.decks.map(d=>`<option value="${esc(d)}">`).join('')}</datalist>
<label>Anverso (inglés)</label><input id="ef" value="${esc(edit.front)}">
<label>Reverso (español)</label><input id="eb" value="${esc(edit.back)}">
<label>Frase de ejemplo</label><input id="ex" value="${esc(edit.ex)}">
<div class="btns"><button onclick="edit=null;render()">Cancelar</button>${edit.id?'<button onclick="delCard()">Borrar</button>':''}<button class="p" onclick="saveCard()">Guardar</button></div></div></div>`}
function saveCard(){const deck=$('#ed').value.trim(),front=$('#ef').value.trim(),back=$('#eb').value.trim(),ex=$('#ex').value.trim();
if(!deck||!front||!back)return toast('Falta el mazo, el anverso o el reverso');
if(edit.id)Object.assign(byId(edit.id),{deck,front,back,ex});else S.cards.push(mk(deck,front,back,ex));
if(!S.decks.includes(deck))S.decks.push(deck);edit=null;save();render()}
function delCard(){S.cards=S.cards.filter(c=>c.id!==edit.id);edit=null;save();render();toast('Tarjeta borrada')}
const nav=()=>`<nav>${[['home','Estudiar'],['cards','Tarjetas'],['more','Progreso']].map(([v,n])=>`<button class="${view===v?'on':''}" onclick="view='${v}';render()">${n}</button>`).join('')}</nav>`;
function render(){const a=$('#app');if(study){a.innerHTML=studyHTML();const t=$('#ty');if(t)t.focus();autoSay();return}
a.innerHTML='<main>'+(view=='home'?homeHTML():view=='cards'?cardsHTML():moreHTML())+'</main>'+nav()+(edit?editorHTML():'')}
render();
</script></body></html>
